<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokédex de Diego</title>
    <link rel="icon" href="assets/images/pokeball.png" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="contenedor">
      <header class="cabecera">
        <h1>Pokédex de Diego</h1>

        <p class="introduccion">
          Primero se pulsa "Cargar Pokémon" y te saldrán los 151, luego se
          puede buscar un Pokémon, bien sea por su nombre o su número de
          Pokédex, y también se puede filtrar por tipo.
        </p>
      </header>

      <button id="boton-cargar" class="boton-cargar" type="button">
        Cargar Pokémon
      </button>

      <form id="formulario-busqueda" class="buscador">
        <label for="busqueda">Nombre o número</label>

        <div class="buscador__controles">
          <input
            id="busqueda"
            name="busqueda"
            type="text"
            placeholder="Ejemplo: pikachu o 25"
            autocomplete="off"
          />

          <button type="submit">Buscar</button>
        </div>

        <label for="filtro-tipo">Tipo</label>

        <select id="filtro-tipo" name="tipo">
          <option value="todos">Todos</option>
        </select>
      </form>

      <p id="mensaje" class="mensaje" aria-live="polite">
        Pulsa "Cargar Pokémon" para empezar.
      </p>

      <section id="resultado" class="resultado"></section>

      <dialog id="panel-detalles" class="panel">
        <div class="panel__caja">
          <button id="boton-cerrar" class="panel__cerrar" type="button">
            Cerrar
          </button>

          <div id="contenido-detalles"></div>
        </div>
      </dialog>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
